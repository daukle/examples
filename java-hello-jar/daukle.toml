schema = 1
project = "daukle/example-java-hello-jar"
version = "1.0.0"

[modules]

# A resolver turns "owner/name@range" into a URL, and is itself acquired by a
# pinned URL: ranging the thing that resolves ranges would be circular, so a
# resolver can never carry a range. The commit is named rather than a branch
# because the digest pins these exact bytes.
[resolvers.github]
url = "https://raw.githubusercontent.com/daukle/daukle/f9055f9a07011283009675f4ffbc0a9b783c50bd/plugins/github-releases.lua"
sha256 = "3789865c266eb53fafcf7300d77a24461170c615195d92d0ddf88078c556e23e"

[plugins]
java = { resolver = "github", coordinate = "daukle/java@^1.0.0" }

[toolchains.java]
version = "21"
main = "com.example.Main"
