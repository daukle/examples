schema = 1
project = "daukle/example-npm-dependency-writer"
version = "1.0.0"

[modules]

# Where the producer's manifest comes from. daukle/path reads
# <path>/daukle.toml, which is the shape to use while a producer publishes no
# release asset of its own; daukle/github reads one from a release.
[sources."example/greeter"]
kind = "path"
path = "./producer"

[resolvers.github]
url = "https://raw.githubusercontent.com/daukle/daukle/23aa207d064bc2ed3e6fb30937414deb1429f3b1/plugins/github-releases.lua"
sha256 = "8f6ba5b69781a7cd1f9a3fc36f82f2ba7448063d13c8817c120ea6144ffb1674"

[plugins]
path = { resolver = "github", coordinate = "daukle/path@^1.0.0" }
npm = { resolver = "github", coordinate = "daukle/npm@^1.0.0" }

[[consumers]]
id = "node"
language = "npm"
file = "package.json"
configuration = "dependencies"

  [consumers.dependencies."example/greeter"]
  version = "^2.0.0"
  modules = ["cli"]
